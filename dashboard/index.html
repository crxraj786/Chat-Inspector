<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat-Inspector Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><div><p class="eyebrow">AUTHORIZED BACKUP</p><h1>Chat-Inspector</h1></div><div><span id="status" class="status">Login required</span><button id="logout" class="logout">Logout</button></div></header><section id="login" class="login"><h2>Owner login</h2><p class="muted">Use the owner ID and API key configured on the server.</p><input id="ownerId" placeholder="Owner ID"><input id="apiKey" type="password" placeholder="API key"><button id="loginButton">Sign in</button><p id="loginError" class="error"></p></section><main id="app" hidden><section class="stats"><article><span>Conversations</span><strong id="conversations">—</strong></article><article><span>Total messages</span><strong id="total">—</strong></article><article><span>Incoming</span><strong id="incoming">—</strong></article><article><span>Outgoing</span><strong id="outgoing">—</strong></article></section><section class="toolbar"><input id="search" placeholder="Search messages, people…"><select id="direction"><option value="">All directions</option><option value="incoming">Incoming</option><option value="outgoing">Outgoing</option></select><button id="refresh">Refresh</button></section><section class="layout"><aside><h2>Conversations</h2><div id="chat-list"><p class="muted">Loading…</p></div></aside><section><div class="section-head"><h2 id="thread-title">Latest messages</h2><span id="result-count"></span></div><div id="messages" class="messages"><p class="muted">Loading…</p></div></section></section></main><script src="app.js"></script></body></html>
