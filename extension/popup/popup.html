<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat-Inspector</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>Chat-Inspector</h1><p class="muted">Local capture + secure uploader</p><label class="toggle"><input id="capture" type="checkbox"><span>Capture enabled</span></label><section class="stats"><div><strong id="count">0</strong><span>Queued</span></div><div><strong id="eventsCount">0</strong><span>Events</span></div></section><section class="config"><h2>API connection</h2><input id="apiUrl" placeholder="https://your-api.example.com"><input id="ownerId" placeholder="Owner ID (optional)"><input id="apiKey" type="password" placeholder="API key"><button id="saveConfig">Save connection</button><button id="upload">Upload queued now</button></section><button id="clear">Clear local queue</button><h2>Recent events</h2><ul id="events"><li class="muted">No events yet</li></ul><p class="notice">No Facebook credentials, cookies, or auto-replies are used.</p></main><script src="popup.js"></script></body></html>
